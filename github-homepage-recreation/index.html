
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage Structure Recreation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <header class="header">

        <div class="logo-placeholder"></div>

        <nav class="nav">
            <div class="nav-item"></div>
            <div class="nav-item"></div>
            <div class="nav-item"></div>
            <div class="nav-item"></div>
        </nav>

        <div class="header-actions">
            <div class="small-placeholder"></div>
            <div class="button-placeholder"></div>
        </div>

    </header>


    <main class="page-shell">

        <!-- Hero Section -->
        <section class="hero">

            <div class="hero-text">

                <div class="line large"></div>
                <div class="line medium"></div>
                <div class="line small"></div>

                <div class="hero-button"></div>

            </div>

            <div class="hero-visual"></div>

        </section>


        <!-- Cards Section -->
        <section class="section">

            <div class="section-heading"></div>

            <div class="cards">

                <article class="card">

                    <div class="card-icon"></div>

                    <div class="line card-title"></div>

                    <div class="line card-line"></div>
                    <div class="line card-line short"></div>

                </article>


                <article class="card">

                    <div class="card-icon"></div>

                    <div class="line card-title"></div>

                    <div class="line card-line"></div>
                    <div class="line card-line short"></div>

                </article>


                <article class="card">

                    <div class="card-icon"></div>

                    <div class="line card-title"></div>

                    <div class="line card-line"></div>
                    <div class="line card-line short"></div>

                </article>

            </div>

        </section>


   
        <section class="feature-grid">

            <div class="feature-large"></div>

            <div class="feature-side">

                <div class="side-box"></div>
                <div class="side-box"></div>

            </div>

        </section>


        <section class="section">

            <div class="section-heading"></div>

            <div class="content-row">

                <div class="content-box"></div>
                <div class="content-box"></div>
                <div class="content-box"></div>

            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="footer-logo"></div>

        <div class="footer-links">

            <div class="footer-link"></div>
            <div class="footer-link"></div>
            <div class="footer-link"></div>
            <div class="footer-link"></div>
            <div class="footer-link"></div>

        </div>

    </footer>

</body>

</html>
