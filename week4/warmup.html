<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Flexbox vs Grid</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; }
    h2 { font-size: 1rem; }
    .box {
      background: #ddd;
      padding: 1rem;
      text-align: center;
    }

    .flex {
      display: flex;
      gap: 0.5rem;
      flex-direction: column
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <h2>Flexbox — one row</h2>
  <section class="flex">
    <div class="box">A</div>
    <div class="box">B</div>
    <div class="box">C</div>
    <div class="box">D</div>
    <div class="box">E</div>
    <div class="box">F</div>
    <div class="box">G</div>
  </section>

  <h2>Grid — three columns, so two rows</h2>
  <section class="grid">
    <div class="box">A</div>
    <div class="box">B</div>
    <div class="box">C</div>
    <div class="box">D</div>
    <div class="box">E</div>
    <div class="box">F</div>
    <div class="box">G</div>
  </section>
</body>
</html>
