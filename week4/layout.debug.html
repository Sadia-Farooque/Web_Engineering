<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Debug</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        /* =========================
           PROBLEM 1: FLEX OVERFLOW
           ========================= */

        .cards {
    display: flex;
    gap: 15px;

    /* BROKEN:
       flex-wrap was missing, causing the flex
       items to overflow on smaller screens.
    */

    /* FIX:
       Allow flex items to move onto another line
       when there is not enough horizontal space.
    */
    flex-wrap: wrap;

    margin-bottom: 40px;
}

        .card {
            background-color: white;
            padding: 30px;
            min-width: 250px;
            border: 2px solid #333;
        }


        /* =========================
           PROBLEM 2: ABSOLUTE BADGE
           ========================= */

   .profile-card {
    background-color: white;
    padding: 30px;
    border: 2px solid #333;

    /* BROKEN:
       The parent had no positioning context,
       so the absolute badge could be positioned
       relative to the wrong element.

       FIX:
       position: relative makes this card the
       positioning reference for the badge.
    */
    position: relative;
}

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;

            background-color: black;
            color: white;
            padding: 5px 10px;
        }

    </style>
</head>

<body>

    <h1>Layout Debug Page</h1>

    <h2>Problem 1: Flex Items</h2>

    <div class="cards">

        <div class="card">
            <h3>Card 1</h3>
            <p>First flex item.</p>
        </div>

        <div class="card">
            <h3>Card 2</h3>
            <p>Second flex item.</p>
        </div>

        <div class="card">
            <h3>Card 3</h3>
            <p>Third flex item.</p>
        </div>

    </div>


    <h2>Problem 2: Absolute Badge</h2>

    <div class="profile-card">

        <span class="badge">NEW</span>

        <h3>Profile Card</h3>

        <p>
            This card contains an absolutely positioned badge.
        </p>

    </div>

</body>
</html>
